:root{
  --ink:#3A2A1C;
  --ink-soft:#6B5640;
  --parch:#FFF3D1;
  --parch-d:#FFE6A8;
  --gold:#E9B94E;
  --orange:#FF8F1F;
  --orange-d:#C95F00;
  --sky:#7CC9F0;
  --job-H:#6B4FD6;
  --job-L:#2E6FDB;
  --job-P:#C93A2E;
  --job-J:#E0A100;
  --job-W:#1F8A4C;
  --font-px:"Galmuri11","DotGothic16","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;background:var(--sky);color:var(--ink);
  font-family:var(--font-px);font-size:15px;line-height:1.6;
  word-break:keep-all;overflow-wrap:anywhere;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;display:block}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 16px 56px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}
.scene-gap{flex:1;min-height:150px}

/* ---------- pixel box ---------- */
.px{
  position:relative;background:var(--parch);margin:4px;padding:18px 18px 20px;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 12px 0 0 rgba(58,42,28,.3);
}
.px::before{content:"";position:absolute;inset:4px;border:2px solid var(--gold);pointer-events:none}
.px>*{position:relative}
.px+.px{margin-top:18px}

/* ---------- buttons ---------- */
.btn{
  display:inline-block;cursor:pointer;border:0;margin:4px;padding:12px 22px;
  background:var(--orange);color:var(--ink);font-weight:700;font-size:17px;letter-spacing:.02em;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -4px 0 0 var(--orange-d),inset 0 4px 0 0 rgba(255,255,255,.4);
  text-decoration:none;text-align:center;
}
.btn:hover{background:#FFA23F}
.btn:active{transform:translateY(3px)}
.btn.alt{background:var(--parch);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -4px 0 0 var(--parch-d),inset 0 4px 0 0 rgba(255,255,255,.6);font-size:14px}
.btn.alt:hover{background:#fff8e3}
.btn.block{display:block;width:calc(100% - 8px)}
:focus-visible{outline:3px solid #1C63D6;outline-offset:4px}

/* ---------- HUD (EXP) ---------- */
.hud{position:sticky;top:0;z-index:5;padding:6px 0 10px}
.hud-in{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:7px 12px;margin:4px;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.hud-lab{font-weight:700;font-size:13px;color:#FFD84A;white-space:nowrap}
.exp{flex:1;height:14px;background:#1d140c;border:2px solid #6B5640;position:relative;overflow:hidden}
.exp-fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#FFD84A 0 6px,#FFC21A 6px 8px);transition:width .35s steps(6,end)}
.hud-num{font-size:13px;white-space:nowrap;min-width:46px;text-align:right}

/* ---------- intro ---------- */
.title-block{padding:18px 4px 0;text-align:center}
.ribbon{display:inline-block;background:var(--orange);color:var(--ink);font-weight:700;font-size:13px;padding:3px 12px;margin-bottom:12px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.title{
  margin:0;font-weight:700;font-size:clamp(38px,12vw,60px);line-height:1.08;color:#fff;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-wrap:balance;
  filter:drop-shadow(0 5px 0 var(--orange-d));
}
.title-sub{margin:14px 0 0;font-weight:700;font-size:16px;color:var(--ink);background:rgba(255,243,209,.9);display:inline-block;padding:3px 10px}
.npc-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:10px}
.npc-cv{width:88px;height:96px;image-rendering:pixelated;flex:none;margin-top:-62px;filter:drop-shadow(0 4px 0 rgba(58,42,28,.25))}
.npc-name{background:var(--ink);color:#fff;font-size:13px;font-weight:400;padding:1px 8px;margin-bottom:2px}
.say{margin:0;font-size:16px;line-height:1.7;min-height:5.2em}
.say .ghost{visibility:hidden}
.jobs-title{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.jobs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;list-style:none;margin:0;padding:0}
.jobs li{text-align:center;font-size:11px;font-weight:700;line-height:1.3}
.jobs canvas{display:block;margin:0 auto 2px;width:55px;height:60px;image-rendering:pixelated}
.start-row{text-align:center;margin-top:16px}
.fine{margin:10px 0 0;text-align:center;font-size:12px;color:var(--ink-soft)}

/* ---------- quiz ---------- */
.quest-wrap{display:flex;justify-content:flex-end;padding-right:8px;position:relative;z-index:2}
.quest-tag{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;margin:0 0 -2px 0;position:relative;z-index:2;
  box-shadow:0 -3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.quest-tag b{color:#FFD84A}
.q-text{margin:0;font-size:17px;line-height:1.7;font-weight:400;min-height:5.4em}
.q-text .ghost{visibility:hidden}
.choices{list-style:none;margin:10px 0 0;padding:0}
.choice{
  display:block;width:100%;text-align:left;cursor:pointer;background:transparent;border:0;border-bottom:2px dotted rgba(58,42,28,.28);
  padding:10px 8px 10px 30px;min-height:44px;position:relative;font-size:14.5px;line-height:1.6;
}
.choices li:last-child .choice{border-bottom:0}
.choice::before{content:"▶";position:absolute;left:8px;top:10px;opacity:0;color:var(--orange-d)}
.choice:hover,.choice:focus-visible{background:#FFE08A;outline:2px solid var(--ink);outline-offset:-2px}
.choice:hover::before,.choice:focus-visible::before{opacity:1}
.choice.picked{background:#FFB347}
.choice.picked::before{opacity:1}
.choice:disabled{cursor:default}

/* ---------- loading ---------- */
.dots{display:inline-block;width:2.4em;text-align:left;overflow:hidden;vertical-align:bottom;animation:dots 1s steps(4,end) infinite}
@keyframes dots{from{width:0}to{width:2.4em}}
.load-bar{height:16px;border:3px solid var(--ink);background:#fff;margin-top:14px;position:relative;overflow:hidden}
.load-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--orange) 0 8px,#FFB347 8px 10px);animation:fill 1.6s steps(12,end) forwards}
@keyframes fill{to{width:100%}}

/* ---------- result ---------- */
.levelup{text-align:center;margin:10px 0 14px}
.levelup span{display:inline-block;font-weight:700;font-size:clamp(26px,8vw,36px);color:#FFD84A;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 4px 0 var(--orange-d))}

    var s = c[2];

    out += '<rect x="'+(p[0]-4).toFixed(1)+'" y="'+(p[1]-4).toFixed(1)+'" width="8" height="8" fill="#FFF3D1" stroke="#3A2A1C" stroke-width="2"/>';
    var l = pt(i, R+30); var isMain = (k === main);
    out += '<text x="'+l[0].toFixed(1)+'" y="'+(l[1]-2).toFixed(1)+'" text-anchor="middle" font-family="Galmuri11" font-weight="700" font-size="13" fill="#3A2A1C">'+(isMain?'★ ':'')+JOBS[k].name+'</text>';
    out += '<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+13).toFixed(1)+'" text-anchor="middle" font-family="Galmuri11" font-size="12" fill="#6B5640">'+scores[k]+' / '+QUESTIONS.length+'</text>';
  });
  return out + '</svg>';
}
function shareText(){
  var r = S.result; var m = JOBS[r.main], s = JOBS[r.sub];
  var t = "나의 법조인 직업은 「" + m.name + "」(" + m.epithet + ")!" + (r.scores[r.sub] > 0 ? " 부 직업은 " + s.name + "." : "") + " 너는 어떤 직업으로 전직할까?\n" + CONFIG.PROGRAM + " · 법조인 전직 테스트 #법조인전직테스트 #청소년로스쿨";
  var u = CONFIG.SHARE_URL === "auto" ? location.href.split(/[?#]/)[0] : CONFIG.SHARE_URL;
  if (u) t += "\n" + u;
  return t;
}
function renderResult(){
  var ranked = rankJobs(); var main = ranked[0], sub = ranked[1];
  S.result = { main:main, sub:sub, ranked:ranked, scores:JSON.parse(JSON.stringify(S.scores)) };
  var J = JOBS[main], SJ = JOBS[sub], PJ = JOBS[J.partner];
  var jc = J.color, darkCls = J.dark ? " dark" : "";
  var sessions = J.quest.map(function(n){ return CURRICULUM[n-1]; });
  var qHtml = sessions.map(function(c, idx){
    var extra = (main === "L" && c.n === 4) ? "변호인(변호사)의 일도 이 회차에서 체험해요. " : "";
    return '<div class="q-session'+darkCls+'"><b>'+c.n+'회차 · '+c.date+'(토) · '+esc(c.title)+'</b><span>'+extra+esc(c.desc)+'</span></div>';
  }).join("");
  var lineHtml = CURRICULUM.map(function(c){
    var mine = (c.job === main) || (main === "L" && c.n === 4);
    return '<li class="'+(mine?'mine':'')+'" style="--mc:'+jc+'"><span class="no">'+c.n+'</span><div><b>'+esc(c.title)+'</b><small>'+c.date+'(토) · '+esc(c.desc)+'</small></div>'+(mine?'<em>내 퀘스트</em>':'<span></span>')+'</li>';
  }).join("");
  var cta = CONFIG.APPLY_URL
    ? '<a class="btn block" href="'+esc(CONFIG.APPLY_URL)+'" target="_blank" rel="noopener">'+esc(CONFIG.APPLY_LABEL)+' ▶</a>'
    : '<p class="p" style="text-align:center"><b>11기 신청 안내는 곧 공개돼요.</b></p>';
  screens.result.innerHTML =
    '<div class="levelup"><span>★ 전직 완료! ★</span></div>'+
    '<article class="px card" style="--jc:'+jc+'">'+
      '<div class="stage-wrap"><canvas class="hero-cv" id="heroCv" aria-hidden="true"></canvas><div class="stand"></div></div>'+
      '<p class="eyebrow">너의 직업은</p>'+
      '<h2 class="job-name'+darkCls+'" tabindex="-1" id="jobName">'+J.name+'</h2>'+
      '<p class="epithet">'+J.epithet+'</p>'+
      '<p class="sub-line">적성 '+S.scores[main]+' / '+QUESTIONS.length+' · '+(S.scores[sub] > 0 ? '부 직업 <span class="chip'+(SJ.dark?' dark':'')+'" style="--jc:'+SJ.color+'">'+SJ.name+'</span> '+S.scores[sub]+' / '+QUESTIONS.length : '한 직업에 올인한 타입!')+'</p>'+
      radarSVG(S.scores, main, jc)+
      '<p class="desc">'+J.desc+'</p>'+
      '<dl class="stats">'+
        '<div><dt>시그니처 스킬</dt><dd><b>'+J.skill[0]+'</b> — '+J.skill[1]+'</dd></div>'+
        '<div><dt>디버프</dt><dd>'+J.debuff+'</dd></div>'+
        '<div><dt>찰떡 파티원</dt><dd><span class="chip'+(PJ.dark?' dark':'')+'" style="--jc:'+PJ.color+'">'+PJ.name+'</span> '+J.partnerText+'</dd></div>'+
      '</dl>'+
    '</article>'+
    '<section class="px" style="--jc:'+jc+'">'+
      '<h3 class="h3">'+J.name+'의 전용 퀘스트</h3>'+ qHtml +
      '<p class="p">청소년 로스쿨 11기에서는 이 직업 하나만 고르지 않아요. 8번의 수업에서 5개 직업을 모두 체험하고, 모의재판으로 마무리해요.</p>'+
    '</section>'+
    '<section class="px">'+
      '<h3 class="h3">11기 퀘스트 라인</h3>'+
      '<p class="p">판례로 이론을 배우고, 직접 체험하며 익혀요.</p>'+
      '<ul class="line">'+lineHtml+'</ul>'+
    '</section>'+
    '<section class="px">'+
      '<h3 class="h3">법에 관심 있는 누구나, 모험을 시작해요</h3>'+
      '<p class="p" style="margin-bottom:10px">법조인이 꿈이 아니어도 괜찮아요. 법이 일상 속 어떤 문제를 풀어주는지 직접 겪어보는 시간이에요.</p>'+ cta +
    '</section>'+
    '<div class="share-row px" style="padding:10px 8px">'+
      '<button class="btn alt" id="btnSave" type="button">결과 카드 저장</button>'+
      '<button class="btn alt" id="btnCopy" type="button">결과 문구 복사</button>'+
      '<button class="btn alt" id="btnShare" type="button" hidden>공유하기</button>'+
      '<button class="btn alt" id="btnAgain" type="button">다시 전직하기</button>'+
    '</div>'+
    '<p class="disclaimer">재미로 해보는 자기이해 테스트예요. 직업을 단정하지 않고, 어떤 성향에 끌리는지 가볍게 돌아보는 용도예요.</p>';
  paintSprite($("heroCv"), main);
  show("result");
  $("jobName").focus({preventScroll:true});
  if (navigator.share) $("btnShare").hidden = false;
  $("btnSave").addEventListener("click", saveCard);
  $("btnCopy").addEventListener("click", copyResult);
  $("btnShare").addEventListener("click", shareResult);
  $("btnAgain").addEventListener("click", startQuiz);
}

/* ---- 공유 ---- */
function copyResult(){
  var t = shareText();
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); toast(ok ? "문구를 복사했어요. 카톡방에 붙여넣어 보세요!" : "복사하지 못했어요. 결과 카드를 저장해서 공유해 주세요.");
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("문구를 복사했어요. 카톡방에 붙여넣어 보세요!"); }, fallback);
  } else fallback();
}
function shareResult(){
  var data = { title:"법조인 전직 테스트", text:shareText() };
  navigator.share(data).catch(function(e){ if (e && e.name !== "AbortError") copyResult(); });
}

/* ---- 결과 카드 이미지 ---- */
var CARD_W = 1080, CARD_H = 1350;
function pbox(g, x, y, w, h, fill, b){
  g.fillStyle = "rgba(58,42,28,.3)"; g.fillRect(x, y+h+b, w, 20);
  g.fillStyle = P.ink; g.fillRect(x-b, y, w+2*b, h); g.fillRect(x, y-b, w, h+2*b);
  g.fillStyle = fill; g.fillRect(x, y, w, h);
}
function outlined(g, text, x, y, size, fill, stroke, weight){
  g.font = (weight||700) + " " + size + "px Galmuri11, sans-serif"; g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.lineJoin = "miter"; g.lineWidth = Math.round(size*0.16); g.strokeStyle = stroke; g.strokeText(text, x, y);
  g.fillStyle = fill; g.fillText(text, x, y);
}
async function makeCard(){
  try { await Promise.all([document.fonts.load('700 40px Galmuri11'), document.fonts.load('400 24px Galmuri11')]); } catch(e){}
  var r = S.result, J = JOBS[r.main], SJ = JOBS[r.sub], PJ = JOBS[J.partner];
  var c = document.createElement("canvas"); c.width = CARD_W; c.height = CARD_H;
  var g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  var ps = 6, W = CARD_W/ps, H = CARD_H/ps;
  drawSky(g, W, H, ps, 22);
  var fg = document.createElement("canvas"); fg.width = CARD_W; fg.height = CARD_H;
  drawFg(fg.getContext("2d"), W, H, ps); g.drawImage(fg, 0, 0);
  outlined(g, "법조인 전직 테스트", CARD_W/2, 112, 64, "#fff", P.ink);
  g.fillStyle = P.ink; g.fillRect(CARD_W/2-186, 140, 372, 52);
  g.fillStyle = "#FF8F1F"; g.fillRect(CARD_W/2-180, 146, 360, 40);
  g.fillStyle = P.ink; g.textAlign = "center"; g.font = "700 26px Galmuri11, sans-serif"; g.fillText(CONFIG.PROGRAM, CARD_W/2, 174);
  var px0 = 80, py0 = 540, pw = CARD_W-160, ph = 700;
  pbox(g, px0, py0, pw, ph, "#FFF3D1", 12);
  g.strokeStyle = "#E9B94E"; g.lineWidth = 6; g.strokeRect(px0+14, py0+14, pw-28, ph-28);
  var k = 12, sw = SPR_W*k, sh = SPR_H*k;
  g.drawImage(spriteCanvas(r.main), CARD_W/2 - sw/2, py0 - sh + 36, sw, sh);
  g.fillStyle = J.color; g.fillRect(CARD_W/2-150, py0+30, 300, 22); g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(CARD_W/2-150, py0+30, 300, 6);
  g.textAlign = "center"; g.fillStyle = P.ink; g.font = "700 28px Galmuri11, sans-serif"; g.fillText("너의 직업은", CARD_W/2, py0+98);
  var size = 112; g.font = "700 " + size + "px Galmuri11, sans-serif";
  while (g.measureText(J.name).width > pw-140 && size > 60){ size -= 4; g.font = "700 " + size + "px Galmuri11, sans-serif"; }
  g.fillStyle = J.dark ? P.ink : J.color; g.fillText(J.name, CARD_W/2, py0+98+size);
  var y = py0+98+size;
  g.fillStyle = P.ink; g.font = "700 38px Galmuri11, sans-serif"; g.fillText(J.epithet, CARD_W/2, y+56);
  g.font = "400 26px Galmuri11, sans-serif";
  g.fillText((r.scores[r.sub] > 0 ? "부 직업 " + SJ.name + "  ·  " : "") + "찰떡 파티원 " + PJ.name, CARD_W/2, y+104);
  var by0 = y+134, rowH = 44, left = px0+80, barX = left+200, barW = pw-160-200-80;
  JOB_ORDER.forEach(function(kk, i){
    var yy = by0 + i*rowH; g.textAlign = "left"; g.fillStyle = P.ink; g.font = (kk===r.main?"700":"400") + " 26px Galmuri11, sans-serif";
    g.fillText(JOBS[kk].name, left, yy+26);
    g.fillStyle = "#E7D9B0"; g.fillRect(barX, yy+6, barW, 24); g.fillStyle = JOBS[kk].color; g.fillRect(barX, yy+6, barW*Math.max(0.04, r.scores[kk]/QUESTIONS.length), 24);
    g.strokeStyle = P.ink; g.lineWidth = 4; g.strokeRect(barX, yy+6, barW, 24);
    g.textAlign = "right"; g.fillStyle = P.ink; g.font = "400 24px Galmuri11, sans-serif"; g.fillText(r.scores[kk]+"/"+QUESTIONS.length, px0+pw-80, yy+26);
  });
  g.textAlign = "center"; g.fillStyle = P.ink; g.font = "400 26px Galmuri11, sans-serif";
  g.fillText("스킬 · " + J.skill[0], CARD_W/2, by0 + 5*rowH + 40);
  g.fillStyle = "#6B5640"; g.font = "400 24px Galmuri11, sans-serif";
  g.fillText("#법조인전직테스트  #청소년로스쿨", CARD_W/2, by0 + 5*rowH + 80);
  outlined(g, "너는 어떤 직업이 될까?", CARD_W/2, 1310, 36, "#fff", P.ink, 400);
  return new Promise(function(res){ c.toBlob(function(b){ res(b); }, "image/png"); });
}
async function saveCard(){
  var btn = $("btnSave"); btn.disabled = true;
  try {
    var blob = await makeCard();
    var dl = null;
    try { dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; } catch(e){ dl = null; }
    var name = "법조인-전직-" + JOBS[S.result.main].name + ".png";
    if (dl){
      try { await dl.save({ filename:name, data:blob }); toast("결과 카드를 저장했어요!"); }
      catch(e){ if (e && e.code === "declined") toast("저장을 취소했어요."); else toast("이 화면에서는 저장할 수 없어요. 화면을 캡처해서 공유해 주세요."); }
    } else {
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000); toast("결과 카드를 저장했어요!");
    }
  } catch(e){ toast("카드를 만들지 못했어요. 화면을 캡처해서 공유해 주세요."); }
  btn.disabled = false;
}

/* ---- 시작/재시작 ---- */
function startQuiz(){ resetState(); show("quiz"); renderQ(); }
$("btnStart").addEventListener("click", startQuiz);
resetState(); initIntro();
window.__quizDebug = { S:S, JOBS:JOBS, QUESTIONS:QUESTIONS };
})();
